/api/master-data/summary:
  get:
    tags: [Master Data]
    summary: Get master data counts
    description: Returns active record counts for customers, locations, carriers, and commodities
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Entity counts
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterDataSummaryResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/master-data/customers:
  get:
    tags: [Master Data]
    summary: List customers
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Customer list
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerListResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  post:
    tags: [Master Data]
    summary: Create customer
    description: Admin or coordinator only
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateCustomerRequest'
    responses:
      '201':
        description: Customer created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerResponse'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: Customer already exists
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/master-data/locations:
  get:
    tags: [Master Data]
    summary: List locations
    description: Filter by type=shipper or type=receiver (includes type=both)
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: type
        schema:
          type: string
          enum: [shipper, receiver, both]
    responses:
      '200':
        description: Location list
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationListResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  post:
    tags: [Master Data]
    summary: Create location
    description: Admin or coordinator only
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateLocationRequest'
    responses:
      '201':
        description: Location created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationResponse'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

