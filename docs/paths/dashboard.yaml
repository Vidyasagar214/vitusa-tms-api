/api/dashboard:
  get:
    tags: [Dashboard]
    summary: Get dashboard summary
    description: Aggregated stats, pipeline, active loads, and exception feed from shipments
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Dashboard summary
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardSummaryResponse'
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
